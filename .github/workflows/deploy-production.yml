name: Deploy to production
on:
  push:
    branches:
      - master
jobs:
  deploy:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    env:
      MONGO_PORT: "27017"
      MONGO_USER: "admin"
      MONGO_PASS: "password123"
      MONGO_URI: "mongodb://admin:password123@localhost:27017/mongo_crowdfunding?authSource=admin"
      REDIS_URI: redis://localhost:6379
      OTP_EXP_SECONDS: 300
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: setup nodejs
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: install dependencies
        run: npm ci

      - name: testing
        run: npm test

      - name: build
        run: npm run build
